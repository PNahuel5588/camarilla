[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camarilla"
version = "0.1.0"
description = "Home inventory management bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["camarilla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
